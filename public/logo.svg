<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none">
  <!-- SHARKONE Logo — Dark Slate + Amber/Gold -->

  <defs>
    <linearGradient id="finGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Shark fin icon — geometric &amp; sleek -->
  <g transform="translate(8, 8)">
    <!-- Main dorsal fin -->
    <path d="M4 68 L38 12 C40 8 44 6 48 8 L52 10 C44 24 30 50 20 68 Z"
          fill="url(#finGrad)" opacity="0.92"/>
    <!-- Fin highlight edge -->
    <path d="M38 12 C40 8 44 6 48 8 L52 10 C44 24 30 50 20 68"
          fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Subtle body silhouette under fin -->
    <path d="M2 70 C8 62 18 58 28 60 C34 61 38 64 40 68 L38 70 C30 66 16 66 6 70 Z"
          fill="#0F172A" opacity="0.08"/>
    <!-- Small accent line — wave hint -->
    <path d="M6 72 C14 68 22 67 30 69" stroke="#F59E0B" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- SHARKONE text -->
  <text x="76" y="58"
        font-family="'Inter', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="2.5"
        fill="#0F172A">
    SHARK<tspan fill="#F59E0B">ONE</tspan>
  </text>

  <!-- Tagline -->
  <text x="78" y="80"
        font-family="'Inter', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="12.5" font-weight="500" letter-spacing="3.5"
        fill="#64748B">
    SHOP · SHIP · SMILE
  </text>
</svg>